<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درباره من</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        p {
            font-size: 18px;
            text-align: justify;
        }
        .skills {
            margin-top: 20px;
        }
        .skills ul {
            list-style-type: none;
            padding: 0;
        }
        .skills ul li {
            background: #e2e2e2;
            margin: 5px 0;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>درباره من</h1>
        <p>
            سلام، من <strong>محمد مهدی ملک پور</strong> هستم. یک طراح سایت و توسعه‌دهنده فرانت‌اند. عاشق ساختن وب‌سایت‌های زیبا و کاربردی هستم و همیشه سعی می‌کنم بهترین تجربه کاربری را برای بازدیدکنندگان فراهم کنم.
        </p>
        <div class="skills">
            <h2>مهارت‌های من</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ul>
        </div>
    </div>
</body>
</html>
